<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elegant Rate Card Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Lora:ital,wght@0,500;0,700;1,400&family=Montserrat:wght@400;600;800&family=Pacifico&family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Poppins:wght@400;600;700&family=Quicksand:wght@500;700&family=Sacramento&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Palette Nuansa Girl Profesional */
      --bg-color-default: #fff5f8;
      --card-bg-default: rgba(255, 255, 255, 0.9);
      --primary-text: #4a4a4a;
      --accent-color: #e4a1a9;
      --accent-hover: #d38c94;
      --text-on-accent: #ffffff;
      --shadow-soft: 0 10px 30px rgba(228, 161, 169, 0.15);
      --glass-bg: rgba(255, 255, 255, 0.5);
      
      /* Dynamic Font Variable */
      --custom-font: 'Poppins', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
    
    body {
      font-family: var(--custom-font);
      background-color: var(--bg-color-default);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--primary-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      transition: all 0.3s ease;
    }

    /* Top Navigation (Admin Button) */
    .nav-bar {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .btn {
      background: var(--accent-color);
      color: var(--text-on-accent);
      border: none;
      padding: 10px 20px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(228, 161, 169, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(228, 161, 169, 0.4); }
    .btn-danger { background: #ff7675; color: white; box-shadow: 0 4px 15px rgba(255, 118, 117, 0.3); }
    .btn-danger:hover { background: #e84393; }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg-default);
      border-radius: 30px;
      padding: 40px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .container::before {
        content: '';
        position: absolute;
        top: -50px;
        right: -50px;
        width: 150px;
        height: 150px;
        background: rgba(228, 161, 169, 0.1);
        border-radius: 50%;
        z-index: 0;
    }

    /* Header */
    .header-title {
      text-align: center;
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      color: var(--accent-color);
      letter-spacing: -1px;
      position: relative;
      z-index: 1;
    }

    .crown-icon {
      color: #ffd700;
      animation: float 3s infinite ease-in-out;
      display: inline-block;
      filter: drop-shadow(0 2px 4px rgba(212, 175, 55, 0.5));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }

    /* Profile */
    .profile-section {
      display: flex;
      justify-content: center;
      margin-bottom: 35px;
      position: relative;
      z-index: 1;
    }

    .profile-img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 6px solid #ffffff;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }
    
    .profile-img:hover { transform: scale(1.05); }

    /* Rate Grid */
    .rate-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 35px;
      position: relative;
      z-index: 1;
    }

    .rate-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      border: 1px solid rgba(228, 161, 169, 0.1);
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .rate-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(228, 161, 169, 0.1);
      border-color: rgba(228, 161, 169, 0.3);
    }

    .rate-platform {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
      color: var(--primary-text);
    }
    
    .rate-platform i { font-size: 1.3rem; width: 25px; text-align: center;}

    .rate-price {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent-color);
      text-align: right;
    }

    /* Details Area */
    .details-area {
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 25px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        position: relative;
        z-index: 1;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .social-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--primary-text);
      text-decoration: none;
      background: #ffffff;
      padding: 12px 20px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      border: 1px solid transparent;
    }

    .social-btn:hover { 
        transform: translateY(-3px);
        box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        border-color: rgba(228, 161, 169, 0.2);
    }

    .fa-facebook { color: #1877f2; }
    .fa-tiktok { color: #000000; }
    .fa-instagram { color: #e4405f; }
    .fa-circle-play { color: #ff7675; }
    .fa-share-nodes { color: var(--accent-color); }

    .notepad-container h4 {
        color: var(--accent-color);
        margin-bottom: 10px;
        font-size: 1.1rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .notepad {
      background: rgba(255, 255, 255, 0.7);
      padding: 20px;
      border-radius: 15px;
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #666;
      border: 1px solid rgba(228, 161, 169, 0.1);
    }

    #admin-action-area { position: relative; z-index: 1; }

    /* Modal Form Admin */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .modal.show { display: flex; opacity: 1; }

    .modal-content {
      background: #ffffff;
      padding: 30px;
      border-radius: 25px;
      max-width: 550px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      color: var(--primary-text);
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }
    
    .modal.show .modal-content { transform: scale(1); }

    .modal-content h3 { color: var(--accent-color); margin-bottom: 20px; font-weight: 800;}
    .modal-content h4 { margin-top: 20px; margin-bottom: 10px; color: #777; border-bottom: 2px solid var(--bg-color-default); padding-bottom: 5px;}

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: #666; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; 
      padding: 12px 15px; 
      border-radius: 12px; 
      border: 1px solid #ddd; 
      background: #fbfbfb; 
      color: var(--primary-text);
      font-family: inherit;
      transition: border-color 0.3s;
    }
    
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
        border-color: var(--accent-color);
        background: #ffffff;
    }

    .modal-content::-webkit-scrollbar { width: 8px; }
    .modal-content::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
    .modal-content::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 10px; }

    @media (max-width: 600px) {
        .container { padding: 25px; border-radius: 20px; }
        .header-title { font-size: 1.8rem; }
        .profile-img { width: 120px; height: 120px; }
        .rate-grid { grid-template-columns: 1fr; }
        .rate-price { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <button id="btn-login-trigger" class="btn" onclick="openLogin()"><i class="fa-solid fa-lock"></i> Admin Login</button>
    <button id="btn-logout" class="btn btn-danger" onclick="logout()" style="display:none;"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
  </div>

  <div class="container">
    <div class="header-title">
      <i class="fa-solid fa-crown crown-icon"></i>
      <span>RATE CARD</span>
    </div>

    <div class="profile-section">
      <img id="view-profile" src="https://via.placeholder.com/150" alt="Profile" class="profile-img">
    </div>

    <div class="rate-grid">
        <div class="rate-card">
            <div class="rate-platform"><i class="fa-brands fa-facebook"></i> FACEBOOK</div>
            <div class="rate-price" id="view-fb-price">Rp. 0</div>
        </div>
        <div class="rate-card">
            <div class="rate-platform"><i class="fa-brands fa-tiktok"></i> TIKTOK</div>
            <div class="rate-price" id="view-tt-price">Rp. 0</div>
        </div>
        <div class="rate-card">
            <div class="rate-platform"><i class="fa-brands fa-instagram"></i> INSTAGRAM</div>
            <div class="rate-price" id="view-ig-price">Rp. 0</div>
        </div>
        <div class="rate-card">
            <div class="rate-platform"><i class="fa-brands fa-facebook"></i> REELS FB</div>
            <div class="rate-price" id="view-reels-price">Rp. 0</div>
        </div>
        <div class="rate-card">
            <div class="rate-platform"><i class="fa-solid fa-circle-play"></i> Only Story</div>
            <div class="rate-price" id="view-story-price">Rp. 0</div>
        </div>
        <div class="rate-card">
            <div class="rate-platform"><i class="fa-solid fa-share-nodes"></i> ALL SOSMED</div>
            <div class="rate-price" id="view-all-price">Rp. 0</div>
        </div>
    </div>

    <div class="details-area">
        <div class="social-links">
          <a id="link-fb" href="#" target="_blank" class="social-btn"><i class="fa-brands fa-facebook"></i> <span id="view-fb-name">Facebook</span></a>
          <a id="link-tt" href="#" target="_blank" class="social-btn"><i class="fa-brands fa-tiktok"></i> <span id="view-tt-name">TikTok</span></a>
          <a id="link-ig" href="#" target="_blank" class="social-btn"><i class="fa-brands fa-instagram"></i> <span id="view-ig-name">Instagram</span></a>
        </div>

        <div class="notepad-container">
          <h4><i class="fa-solid fa-note-sticky"></i> Catatan Ketentuan</h4>
          <div id="view-notepad" class="notepad">Belum ada catatan.</div>
        </div>
    </div>

    <div id="admin-action-area" style="margin-top:30px; display:none; text-align:center;">
      <button class="btn" onclick="openAdminPanel()" style="background:#10b981; margin: 0 auto;"><i class="fa-solid fa-gear"></i> Buka Control Panel Admin</button>
    </div>
  </div>

  <div id="modal-login" class="modal">
    <div class="modal-content" style="max-width: 380px;">
      <h3>Admin Login</h3>
      <div class="form-group"><label>Username</label><input type="text" id="login-user" placeholder="rekaanjani123"></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-pass" placeholder="12345reka"></div>
      <button class="btn" onclick="submitLogin()" style="width:100%; justify-content: center; margin-top: 10px;">Masuk</button>
      <button class="btn btn-danger" onclick="closeModal('modal-login')" style="width:100%; justify-content: center; margin-top:10px;">Batal</button>
    </div>
  </div>

  <div id="modal-admin" class="modal">
    <div class="modal-content">
      <h3>Setting Dashboard</h3>
      
      <h4>Tampilan & Font Text</h4>
      <div class="form-group">
        <label>Pilihan Font Teks Dashboard</label>
        <select id="set-font">
          <optgroup label="Modern & Clean">
            <option value="'Poppins', sans-serif">Poppins (Modern Clean)</option>
            <option value="'Quicksand', sans-serif">Quicksand (Soft Rounded Girl)</option>
            <option value="'Montserrat', sans-serif">Montserrat (Trendy & Bold)</option>
            <option value="'Segoe UI', Roboto, sans-serif">Segoe UI (Minimalist)</option>
          </optgroup>
          <optgroup label="Elegant & Classy">
            <option value="'Playfair Display', serif">Playfair Display (Luxury Modern)</option>
            <option value="'Lora', serif">Lora (Classic Serif)</option>
          </optgroup>
          <optgroup label="Estetis & Handcrafted (Aesthetic)">
            <option value="'Dancing Script', cursive">Dancing Script (Aesthetic Cursive)</option>
            <option value="'Great Vibes', cursive">Great Vibes (Soft Calligraphy)</option>
            <option value="'Pacifico', cursive">Pacifico (Cute Casual)</option>
            <option value="'Sacramento', cursive">Sacramento (Elegant Script)</option>
          </optgroup>
        </select>
      </div>
      <div class="form-group"><label>URL Wallpaper Background</label><input type="text" id="set-bg-url" placeholder="https://image-link.com/bg.jpg"></div>
      <div class="form-group"><label>Warna Card Dashboard</label><input type="color" id="set-card-bg" value="#ffffff"></div>

      <h4>Profil</h4>
      <div class="form-group"><label>URL Foto Profil</label><input type="text" id="set-profile-url" placeholder="Https://..."></div>
      <div class="form-group"><label>Atau Unggah Foto (Lokal)</label><input type="file" id="set-profile-file" accept="image/*"></div>

      <h4>Setting Harga (Rp)</h4>
      <div class="form-group"><label>Facebook</label><input type="text" id="set-fb-price"></div>
      <div class="form-group"><label>TikTok</label><input type="text" id="set-tt-price"></div>
      <div class="form-group"><label>Instagram</label><input type="text" id="set-ig-price"></div>
      <div class="form-group"><label>Reels Facebook</label><input type="text" id="set-reels-price"></div>
      <div class="form-group"><label>Only Story</label><input type="text" id="set-story-price"></div>
      <div class="form-group"><label>ALL SOSMED</label><input type="text" id="set-all-price"></div>

      <h4>Akun Sosmed</h4>
      <div class="form-group"><label>Nama FB</label><input type="text" id="set-fb-name"></div>
      <div class="form-group"><label>Link FB</label><input type="text" id="set-fb-link"></div>
      <div class="form-group"><label>Nama TikTok</label><input type="text" id="set-tt-name"></div>
      <div class="form-group"><label>Link TikTok</label><input type="text" id="set-tt-link"></div>
      <div class="form-group"><label>Nama IG</label><input type="text" id="set-ig-name"></div>
      <div class="form-group"><label>Link IG</label><input type="text" id="set-ig-link"></div>

      <h4>Catatan / Ketentuan</h4>
      <div class="form-group"><textarea id="set-notepad" rows="5"></textarea></div>

      <div style="position: sticky; bottom: 0; background: white; padding-top: 10px; padding-bottom: 10px; border-top: 1px solid #eee; margin-top: 20px;">
        <button class="btn" onclick="saveAdminSettings()" style="width:100%; background:#10b981; justify-content: center;">Simpan Perubahan</button>
        <button class="btn btn-danger" onclick="closeModal('modal-admin')" style="width:100%; justify-content: center; margin-top:10px;">Tutup</button>
      </div>
    </div>
  </div>

  <script>
    const defaultData = {
      bgUrl: '', 
      cardBg: '#ffffff', 
      font: "'Poppins', sans-serif",
      profileUrl: 'https://via.placeholder.com/150/e4a1a9/ffffff?text=Girl+Pro',
      fbPrice: '150.000', ttPrice: '250.000', igPrice: '200.000',
      reelsPrice: '100.000', storyPrice: '75.000', allPrice: '600.000',
      fbName: 'Official Facebook', fbLink: 'https://facebook.com',
      ttName: '@username.tiktok', ttLink: 'https://tiktok.com',
      igName: '@username.ig', igLink: 'https://instagram.com',
      notepad: 'Terima kasih telah tertarik untuk berkolaborasi!\n\nKetentuan Umum:\n1. Konten keep 30 hari.\n2. Payment wajib dilakukan upfront (DP 50% atau Pelunasan).\n3. Revisi maksimal 1x sebelum posting.'
    };

    function loadData() {
      const data = JSON.parse(localStorage.getItem('ratecard_data_v3')) || defaultData;
      
      // Update Style & Font secara menyeluruh
      if(data.bgUrl) {
          document.body.style.backgroundImage = `url('${data.bgUrl}')`;
      } else {
          document.body.style.backgroundImage = 'none';
          document.body.style.backgroundColor = 'var(--bg-color-default)';
      }
      
      document.documentElement.style.setProperty('--card-bg-default', data.cardBg || '#ffffff');
      
      // Terapkan font terpilih ke CSS Root & Body
      document.documentElement.style.setProperty('--custom-font', data.font);
      document.body.style.fontFamily = data.font;

      // Profile
      document.getElementById('view-profile').src = data.profileUrl;

      // Prices
      document.getElementById('view-fb-price').innerText = 'Rp. ' + data.fbPrice;
      document.getElementById('view-tt-price').innerText = 'Rp. ' + data.ttPrice;
      document.getElementById('view-ig-price').innerText = 'Rp. ' + data.igPrice;
      document.getElementById('view-reels-price').innerText = 'Rp. ' + data.reelsPrice;
      document.getElementById('view-story-price').innerText = 'Rp. ' + data.storyPrice;
      document.getElementById('view-all-price').innerText = 'Rp. ' + data.allPrice;

      // Socials
      document.getElementById('view-fb-name').innerText = data.fbName;
      document.getElementById('link-fb').href = data.fbLink;
      document.getElementById('view-tt-name').innerText = data.ttName;
      document.getElementById('link-tt').href = data.ttLink;
      document.getElementById('view-ig-name').innerText = data.igName;
      document.getElementById('link-ig').href = data.igLink;

      // Notepad
      document.getElementById('view-notepad').innerText = data.notepad;
    }

    // Handle Upload Foto Lokal
    document.getElementById('set-profile-file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        if (file.size > 2 * 1024 * 1024) {
            alert("Ukuran file terlalu besar (Maks 2MB). Gunakan Link URL foto untuk hasil terbaik.");
            this.value = "";
            return;
        }
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById('set-profile-url').value = evt.target.result;
        }
        reader.readAsDataURL(file);
      }
    });

    function openModal(id) {
        const modal = document.getElementById(id);
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('show'), 10);
    }
    
    function closeModal(id) {
        const modal = document.getElementById(id);
        modal.classList.remove('show');
        setTimeout(() => modal.style.display = 'none', 300);
    }
    
    function openLogin() { openModal('modal-login'); }

    function submitLogin() {
      const u = document.getElementById('login-user').value;
      const p = document.getElementById('login-pass').value;

      if(u === 'rekaanjani123' && p === '12345reka') {
        sessionStorage.setItem('isAdminLoggedIn', 'true');
        closeModal('modal-login');
        checkAdminSession();
        openAdminPanel();
        document.getElementById('login-user').value = '';
        document.getElementById('login-pass').value = '';
      } else {
        alert('Maaf, Username atau Password Salah!');
      }
    }

    function logout() {
      sessionStorage.removeItem('isAdminLoggedIn');
      checkAdminSession();
      location.reload();
    }

    function checkAdminSession() {
      const isAdmin = sessionStorage.getItem('isAdminLoggedIn') === 'true';
      document.getElementById('btn-login-trigger').style.display = isAdmin ? 'none' : 'block';
      document.getElementById('btn-logout').style.display = isAdmin ? 'block' : 'none';
      document.getElementById('admin-action-area').style.display = isAdmin ? 'block' : 'none';
    }

    function openAdminPanel() {
      const data = JSON.parse(localStorage.getItem('ratecard_data_v3')) || defaultData;
      
      document.getElementById('set-font').value = data.font || "'Poppins', sans-serif";
      document.getElementById('set-bg-url').value = data.bgUrl || '';
      document.getElementById('set-card-bg').value = data.cardBg || '#ffffff';
      document.getElementById('set-profile-url').value = data.profileUrl || '';
      
      document.getElementById('set-fb-price').value = data.fbPrice || '';
      document.getElementById('set-tt-price').value = data.ttPrice || '';
      document.getElementById('set-ig-price').value = data.igPrice || '';
      document.getElementById('set-reels-price').value = data.reelsPrice || '';
      document.getElementById('set-story-price').value = data.storyPrice || '';
      document.getElementById('set-all-price').value = data.allPrice || '';

      document.getElementById('set-fb-name').value = data.fbName || '';
      document.getElementById('set-fb-link').value = data.fbLink || '';
      document.getElementById('set-tt-name').value = data.ttName || '';
      document.getElementById('set-tt-link').value = data.ttLink || '';
      document.getElementById('set-ig-name').value = data.igName || '';
      document.getElementById('set-ig-link').value = data.igLink || '';

      document.getElementById('set-notepad').value = data.notepad || '';

      openModal('modal-admin');
    }

    function saveAdminSettings() {
      const updatedData = {
        font: document.getElementById('set-font').value,
        bgUrl: document.getElementById('set-bg-url').value,
        cardBg: document.getElementById('set-card-bg').value,
        profileUrl: document.getElementById('set-profile-url').value || defaultData.profileUrl,
        fbPrice: document.getElementById('set-fb-price').value || '0',
        ttPrice: document.getElementById('set-tt-price').value || '0',
        igPrice: document.getElementById('set-ig-price').value || '0',
        reelsPrice: document.getElementById('set-reels-price').value || '0',
        storyPrice: document.getElementById('set-story-price').value || '0',
        allPrice: document.getElementById('set-all-price').value || '0',
        fbName: document.getElementById('set-fb-name').value || 'Facebook',
        fbLink: document.getElementById('set-fb-link').value || '#',
        ttName: document.getElementById('set-tt-name').value || 'TikTok',
        ttLink: document.getElementById('set-tt-link').value || '#',
        igName: document.getElementById('set-ig-name').value || 'Instagram',
        igLink: document.getElementById('set-ig-link').value || '#',
        notepad: document.getElementById('set-notepad').value || 'Tidak ada catatan.',
      };

      localStorage.setItem('ratecard_data_v3', JSON.stringify(updatedData));
      
      loadData();
      closeModal('modal-admin');
      alert('Settingan Font & Dashboard Berhasil Disimpan!');
    }

    window.onclick = function(event) {
        if (event.target.className === 'modal show') {
            event.target.classList.remove('show');
            setTimeout(() => event.target.style.display = 'none', 300);
        }
    }

    loadData();
    checkAdminSession();
  </script>
</body>
</html>
