<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 30px 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: #9d174d;
        }

        .btn-auth {
            background: #ffffff;
            color: #db2777;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #831843;
            margin-bottom: 20px;
            user-select: none;
        }

        .profile-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .profile-frame {
            padding: 6px;
            background: linear-gradient(135deg, #ffffff, #f472b6);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(244, 114, 182, 0.3);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .price-list {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(219, 39, 119, 0.2);
            font-size: 13px;
            font-weight: 600;
            color: #831843;
        }

        .price-item:last-child {
            border-bottom: none;
        }

        .price-val {
            background: #ffffff;
            padding: 4px 12px;
            border-radius: 12px;
            color: #db2777;
        }

        .social-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .social-btn {
            background: #ffffff;
            color: #831843;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .notepad-box {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            padding: 15px;
            font-size: 12px;
            color: #831843;
            line-height: 1.5;
            white-space: pre-line;
        }

        .admin-panel {
            display: none;
            margin-top: 25px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .admin-panel h3 {
            font-size: 14px;
            color: #db2777;
            margin-bottom: 12px;
        }

        .admin-input {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 10px;
            border: 1px solid #fbcfe8;
            border-radius: 8px;
            font-size: 12px;
        }

        .btn-save {
            width: 100%;
            background: #db2777;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="top-bar">
            <!-- Badge & Tombol Login Tersembunyi (Rahasia Admin) -->
            <span id="roleBadge" class="badge" style="display: none;">Mode: Pelihat</span>
            <button id="authBtn" class="btn-auth" onclick="toggleAdminLogin()" style="display: none;">Login Admin</button>
        </div>

        <!-- Klik 3 kali di judul ini untuk memunculkan Login Admin -->
        <h1 class="title" onclick="triggerSecretLogin()" style="cursor: pointer;">👑 RATE CARD</h1>

        <div class="profile-wrapper">
            <div class="profile-frame">
                <img id="displayProfile" class="profile-img" src="" alt="Profile">
            </div>
        </div>

        <div class="price-list">
            <div class="price-item"><span>FACEBOOK</span><span id="priceFb" class="price-val">Rp. 0</span></div>
            <div class="price-item"><span>TIKTOK</span><span id="priceTiktok" class="price-val">Rp. 0</span></div>
            <div class="price-item"><span>INSTAGRAM</span><span id="priceIg" class="price-val">Rp. 0</span></div>
            <div class="price-item"><span>REELS FACEBOOK</span><span id="priceReelsFb" class="price-val">Rp. 0</span></div>
            <div class="price-item"><span>Only Story</span><span id="priceStory" class="price-val">Rp. 0</span></div>
            <div class="price-item"><span>ALL SOSMED</span><span id="priceAll" class="price-val">Rp. 0</span></div>
        </div>

        <div class="social-btns">
            <a id="linkFb" class="social-btn" target="_blank">f <span id="textFb"></span></a>
            <a id="linkTiktok" class="social-btn" target="_blank">🎵 <span id="textTiktok"></span></a>
            <a id="linkIg" class="social-btn" target="_blank">📷 <span id="textIg"></span></a>
        </div>

        <div class="notepad-box">
            <strong>📋 CATATAN PENTING</strong><br>
            <span id="displayNotepad"></span>
        </div>

        <!-- PANEL ADMIN -->
        <div id="adminPanel" class="admin-panel">
            <h3>⚙️ Panel Pengaturan Admin</h3>
            <label style="font-size:11px;">URL Background:</label>
            <input type="text" id="inputBg" class="admin-input">
            
            <label style="font-size:11px;">URL Foto Profil:</label>
            <input type="text" id="inputProfile" class="admin-input">
            <input type="file" accept="image/*" onchange="uploadProfileImage(event)" style="margin-bottom:10px; font-size:11px;">

            <label style="font-size:11px;">Harga (FB, TikTok, IG, Reels, Story, All):</label>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                <input type="text" id="inFb" class="admin-input" placeholder="FB">
                <input type="text" id="inTiktok" class="admin-input" placeholder="TikTok">
                <input type="text" id="inIg" class="admin-input" placeholder="IG">
                <input type="text" id="inReelsFb" class="admin-input" placeholder="Reels">
                <input type="text" id="inStory" class="admin-input" placeholder="Story">
                <input type="text" id="inAll" class="admin-input" placeholder="All">
            </div>

            <label style="font-size:11px;">Username Sosmed (FB, TikTok, IG):</label>
            <input type="text" id="inUserFb" class="admin-input" placeholder="FB User">
            <input type="text" id="inUserTiktok" class="admin-input" placeholder="TikTok User">
            <input type="text" id="inUserIg" class="admin-input" placeholder="IG User">

            <label style="font-size:11px;">Catatan Notepad:</label>
            <textarea id="inNotepad" class="admin-input" rows="3"></textarea>

            <button class="btn-save" onclick="saveAdminSettings()">Simpan Perubahan Online</button>
            <p id="loadingStatus" style="display:none; font-size:11px; color:#db2777; text-align:center; margin-top:5px;">Menyimpan data...</p>
        </div>
    </div>

    <script>
        let config = {
            bgUrl: '',
            themeColor: '#f472b6',
            profileUrl: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400',
            fontFamily: "'Poppins', sans-serif",
            prices: { fb: '150.000', tiktok: '250.000', ig: '200.000', reelsFb: '100.000', story: '75.000', all: '500.000' },
            socials: { fb: 'reka.anjani', tiktok: 'rekaanjani_real', ig: 'reka.anjani' },
            notepad: '💕 Ketentuan Kolaborasi 💕\n• DP minimal 50% sebelum pengerjaan.\n• Revisi maksimal 1x.'
        };

        let isAdminLoggedIn = false;
        let clickCount = 0;

        // KUNCI DATABASE ONLINE (SUDAH DIPERBAIKI)
        const binId = '6a88075df5f4af5e293045d0'; 
        const apiKey = '$2a$10$RToIDZQyfCwAmmFIgopn6O1Nf2lOWMZy5cE7zwXLMHjagMg0EP5I';

        window.onload = function() {
            loadDataFromDatabase();
        };

        // FITUR RAHASIA LOGIN ADMIN (Klik 3x di Judul 👑 RATE CARD)
        function triggerSecretLogin() {
            clickCount++;
            if (clickCount >= 3) {
                clickCount = 0;
                toggleAdminLogin();
            }
        }

        // Shortcut Keyboard: Ctrl + Shift + A
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.shiftKey && event.key === 'A') {
                toggleAdminLogin();
            }
        });

        async function loadDataFromDatabase() {
            if (binId && apiKey) {
                try {
                    const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                        method: 'GET',
                        headers: { 'X-Master-Key': apiKey }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        config = data.record;
                        applySettingsToView();
                        return;
                    }
                } catch (err) {
                    console.log("Error loading database");
                }
            }
            applySettingsToView();
        }

        function applySettingsToView() {
            if (config.bgUrl) {
                document.body.style.background = `url('${config.bgUrl}') center/cover fixed no-repeat`;
            }
            document.getElementById('displayProfile').src = config.profileUrl;

            document.getElementById('priceFb').innerText = 'Rp. ' + config.prices.fb;
            document.getElementById('priceTiktok').innerText = 'Rp. ' + config.prices.tiktok;
            document.getElementById('priceIg').innerText = 'Rp. ' + config.prices.ig;
            document.getElementById('priceReelsFb').innerText = 'Rp. ' + config.prices.reelsFb;
            document.getElementById('priceStory').innerText = 'Rp. ' + config.prices.story;
            document.getElementById('priceAll').innerText = 'Rp. ' + config.prices.all;

            document.getElementById('textFb').innerText = config.socials.fb;
            document.getElementById('linkFb').href = 'https://facebook.com/' + config.socials.fb;

            document.getElementById('textTiktok').innerText = config.socials.tiktok;
            document.getElementById('linkTiktok').href = 'https://tiktok.com/@' + config.socials.tiktok;

            document.getElementById('textIg').innerText = config.socials.ig;
            document.getElementById('linkIg').href = 'https://instagram.com/' + config.socials.ig;

            document.getElementById('displayNotepad').innerText = config.notepad;
        }

        function toggleAdminLogin() {
            if (isAdminLoggedIn) {
                isAdminLoggedIn = false;
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('roleBadge').style.display = 'none';
                document.getElementById('authBtn').style.display = 'none';
                alert("Berhasil Logout!");
            } else {
                const user = prompt("Masukkan Username Admin:");
                const pass = prompt("Masukkan Password Admin:");

                if (user === "rekaanjani123" && pass === "12345reka") {
                    isAdminLoggedIn = true;
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('roleBadge').style.display = 'inline-block';
                    document.getElementById('roleBadge').innerText = 'Mode: Admin';
                    document.getElementById('authBtn').style.display = 'inline-block';
                    document.getElementById('authBtn').innerText = 'Logout';
                    loadFormValues();
                } else {
                    alert("Username atau Password salah!");
                }
            }
        }

        function loadFormValues() {
            document.getElementById('inputBg').value = config.bgUrl;
            document.getElementById('inputProfile').value = config.profileUrl;

            document.getElementById('inFb').value = config.prices.fb;
            document.getElementById('inTiktok').value = config.prices.tiktok;
            document.getElementById('inIg').value = config.prices.ig;
            document.getElementById('inReelsFb').value = config.prices.reelsFb;
            document.getElementById('inStory').value = config.prices.story;
            document.getElementById('inAll').value = config.prices.all;

            document.getElementById('inUserFb').value = config.socials.fb;
            document.getElementById('inUserTiktok').value = config.socials.tiktok;
            document.getElementById('inUserIg').value = config.socials.ig;

            document.getElementById('inNotepad').value = config.notepad;
        }

        function uploadProfileImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('inputProfile').value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        async function saveAdminSettings() {
            const statusText = document.getElementById('loadingStatus');
            statusText.style.display = 'block';

            config.bgUrl = document.getElementById('inputBg').value;
            config.profileUrl = document.getElementById('inputProfile').value;

            config.prices.fb = document.getElementById('inFb').value;
            config.prices.tiktok = document.getElementById('inTiktok').value;
            config.prices.ig = document.getElementById('inIg').value;
            config.prices.reelsFb = document.getElementById('inReelsFb').value;
            config.prices.story = document.getElementById('inStory').value;
            config.prices.all = document.getElementById('inAll').value;

            config.socials.fb = document.getElementById('inUserFb').value;
            config.socials.tiktok = document.getElementById('inUserTiktok').value;
            config.socials.ig = document.getElementById('inUserIg').value;

            config.notepad = document.getElementById('inNotepad').value;

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': apiKey
                    },
                    body: JSON.stringify(config)
                });

                if (response.ok) {
                    alert('Data BERHASIL Disimpan Online!');
                } else {
                    alert('Gagal menyimpan ke server.');
                }
            } catch (err) {
                alert('Gagal terhubung ke Database online.');
            }

            statusText.style.display = 'none';
            applySettingsToView();
        }
    </script>
</body>
</html>
