<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Rate Card Estetik</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fbcfe8 0%, #f472b6 50%, #f43f5e 100%);
            --card-bg: rgba(255, 255, 255, 0.45);
            --card-border: rgba(255, 255, 255, 0.7);
            --text-main: #881337;
            --text-accent: #e11d48;
            --font-main: 'Poppins', sans-serif;
            --font-heading: 'Playfair Display', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
        }

        body {
            background: var(--bg-gradient);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard-card {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(225, 29, 72, 0.15),
                        inset 0 0 0 1px var(--card-border);
            position: relative;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .badge-role {
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .btn-auth {
            background: #ffffff;
            color: var(--text-accent);
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.12);
            transition: all 0.3s ease;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(225, 29, 72, 0.2);
        }

        .header-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-title h1 {
            font-family: var(--font-heading);
            font-size: 2.3rem;
            letter-spacing: 3px;
            color: #4c0519;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
        }

        .crown-animate {
            color: #fbbf24;
            filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6));
            animation: floatingCrown 2.5s ease-in-out infinite;
        }

        @keyframes floatingCrown {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(6deg); }
        }

        .profile-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .profile-frame {
            position: relative;
            padding: 6px;
            background: linear-gradient(135deg, #ffffff, #f472b6);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(244, 114, 182, 0.3);
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 3px solid #ffffff;
        }

        .rate-container {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .rate-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px dashed rgba(225, 29, 72, 0.2);
        }

        .rate-item:last-child {
            border-bottom: none;
        }

        .social-tag {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .social-tag i {
            font-size: 1.3rem;
            width: 24px;
            text-align: center;
        }

        .fa-facebook { color: #1877f2; }
        .fa-tiktok { color: #000000; }
        .fa-instagram { color: #e4405f; }
        .fa-wand-magic-sparkles { color: #f43f5e; }
        .fa-crown { color: #eab308; }

        .price-tag {
            font-weight: 600;
            color: #9f1239;
            font-size: 1.05rem;
            background: rgba(255, 255, 255, 0.7);
            padding: 4px 12px;
            border-radius: 12px;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .btn-social {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.75);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 1px solid #ffffff;
        }

        .btn-social:hover {
            background: #ffffff;
            transform: translateY(-3deg);
            color: var(--text-accent);
            box-shadow: 0 8px 18px rgba(225, 29, 72, 0.15);
        }

        .notepad-box {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 18px;
            border-left: 4px solid var(--text-accent);
            position: relative;
        }

        .notepad-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: var(--text-accent);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notepad-content {
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            color: #4c0519;
        }

        .admin-panel {
            display: none;
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid #f472b6;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .admin-panel h3 {
            font-family: var(--font-heading);
            color: var(--text-accent);
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #fbcfe8;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid #f472b6;
            background: #fff;
            color: #333;
            font-size: 0.85rem;
            outline: none;
        }

        .btn-save {
            width: 100%;
            padding: 12px;
            background: var(--text-accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
            transition: all 0.3s;
        }

        .btn-save:hover {
            background: #be123c;
        }

        .loading-text {
            text-align: center;
            font-size: 0.85rem;
            color: #be123c;
            display: none;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .header-title h1 { font-size: 1.8rem; }
            .dashboard-card { padding: 22px; }
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <div class="top-bar">
        <span id="roleBadge" class="badge-role">Mode: Pelihat</span>
        <button id="authBtn" class="btn-auth" onclick="toggleAdminLogin()">Login Admin</button>
    </div>

    <div class="header-title">
        <h1><i class="fa-solid fa-crown crown-animate"></i> RATE CARD</h1>
    </div>

    <div class="profile-wrapper">
        <div class="profile-frame">
            <img id="displayProfile" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400" alt="Foto Profil" class="profile-img">
        </div>
    </div>

    <div class="rate-container">
        <div class="rate-item">
            <div class="social-tag"><i class="fa-brands fa-facebook"></i> FACEBOOK</div>
            <div class="price-tag" id="priceFb">Rp. 0</div>
        </div>
        <div class="rate-item">
            <div class="social-tag"><i class="fa-brands fa-tiktok"></i> TIKTOK</div>
            <div class="price-tag" id="priceTiktok">Rp. 0</div>
        </div>
        <div class="rate-item">
            <div class="social-tag"><i class="fa-brands fa-instagram"></i> INSTAGRAM</div>
            <div class="price-tag" id="priceIg">Rp. 0</div>
        </div>
        <div class="rate-item">
            <div class="social-tag"><i class="fa-brands fa-facebook"></i> REELS FACEBOOK</div>
            <div class="price-tag" id="priceReelsFb">Rp. 0</div>
        </div>
        <div class="rate-item">
            <div class="social-tag"><i class="fa-solid fa-wand-magic-sparkles"></i> Only Story</div>
            <div class="price-tag" id="priceStory">Rp. 0</div>
        </div>
        <div class="rate-item">
            <div class="social-tag"><i class="fa-solid fa-crown"></i> ALL SOSMED</div>
            <div class="price-tag" id="priceAll">Rp. 0</div>
        </div>
    </div>

    <div class="social-buttons">
        <a id="linkFb" href="#" target="_blank" class="btn-social"><i class="fa-brands fa-facebook"></i> <span id="textFb">Facebook</span></a>
        <a id="linkTiktok" href="#" target="_blank" class="btn-social"><i class="fa-brands fa-tiktok"></i> <span id="textTiktok">TikTok</span></a>
        <a id="linkIg" href="#" target="_blank" class="btn-social"><i class="fa-brands fa-instagram"></i> <span id="textIg">Instagram</span></a>
    </div>

    <div class="notepad-box">
        <div class="notepad-title"><i class="fa-regular fa-note-sticky"></i> Catatan Penting</div>
        <div class="notepad-content" id="displayNotepad">Memuat data...</div>
    </div>

    <!-- PANEL ADMIN -->
    <div id="adminPanel" class="admin-panel">
        <h3><i class="fa-solid fa-sliders"></i> Panel Pengaturan Admin</h3>
        
        <div class="form-grid">
            <div class="form-group">
                <label>API Key JSONBin</label>
                <input type="text" id="binApiKey" placeholder="Masukkan Master Key JSONBin">
            </div>
            <div class="form-group">
                <label>Bin ID JSONBin</label>
                <input type="text" id="binId" placeholder="Masukkan Bin ID JSONBin">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label>URL Background / Wallpaper</label>
                <input type="text" id="inputBg" placeholder="https://link-gambar.com/bg.jpg">
            </div>
            <div class="form-group">
                <label>Warna Tema Overlay</label>
                <input type="color" id="inputColor" value="#f472b6">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label>URL Foto Profil (Link)</label>
                <input type="text" id="inputProfile" placeholder="https://link-gambar.com/profil.jpg">
            </div>
            <div class="form-group">
                <label>Atau Unggah dari Galeri</label>
                <input type="file" id="fileProfile" accept="image/*" onchange="uploadProfileImage(event)">
            </div>
        </div>

        <div class="form-group">
            <label>Ganti Jenis Font</label>
            <select id="inputFont">
                <option value="'Poppins', sans-serif">Poppins (Modern)</option>
                <option value="'Playfair Display', serif">Playfair (Anggun & Elegan)</option>
                <option value="'Great Vibes', cursive">Great Vibes (Kaligrafi)</option>
            </select>
        </div>

        <h4 style="margin: 12px 0 8px; font-size: 0.9rem; color: var(--text-accent);">Setting Harga (Rp)</h4>
        <div class="form-grid">
            <div class="form-group"><label>Facebook</label><input type="text" id="inFb"></div>
            <div class="form-group"><label>TikTok</label><input type="text" id="inTiktok"></div>
            <div class="form-group"><label>Instagram</label><input type="text" id="inIg"></div>
            <div class="form-group"><label>Reels FB</label><input type="text" id="inReelsFb"></div>
            <div class="form-group"><label>Only Story</label><input type="text" id="inStory"></div>
            <div class="form-group"><label>ALL SOSMED</label><input type="text" id="inAll"></div>
        </div>

        <h4 style="margin: 12px 0 8px; font-size: 0.9rem; color: var(--text-accent);">Setting Username Sosmed</h4>
        <div class="form-grid">
            <div class="form-group"><label>Username FB</label><input type="text" id="inUserFb"></div>
            <div class="form-group"><label>Username TikTok</label><input type="text" id="inUserTiktok"></div>
            <div class="form-group"><label>Username IG</label><input type="text" id="inUserIg"></div>
        </div>

        <div class="form-group">
            <label>Isi Catatan Notepad</label>
            <textarea id="inNotepad" rows="3"></textarea>
        </div>

        <button class="btn-save" onclick="saveAdminSettings()">Simpan Perubahan ke Database Online</button>
        <div id="loadingStatus" class="loading-text">Menyimpan data ke server...</div>
    </div>
</div>

<script>
    // Konfigurasi Default awal
    let config = {
        bgUrl: '',
        themeColor: '#f472b6',
        profileUrl: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400',
        fontFamily: "'Poppins', sans-serif",
        prices: {
            fb: '150.000',
            tiktok: '250.000',
            ig: '200.000',
            reelsFb: '100.000',
            story: '75.000',
            all: '500.000'
        },
        socials: {
            fb: 'reka.anjani',
            tiktok: 'rekaanjani_real',
            ig: 'reka.anjani'
        },
        notepad: '💕 Ketentuan Kolaborasi 💕\n• DP minimal 50% sebelum pengerjaan.\n• Revisi maksimal 1x.'
    };

    let isAdminLoggedIn = false;

    // KUNCI DATABASE PUBLIC - Ganti dengan Kunci JSONBin Anda sendiri agar terhubung penuh
    let binId ='6a88075df5f4af5e293045d0';
    let apiKey ='$2a$10$RToIDZQyfCwAmmFIgopn6O1Nf2lOWMZy5cE7zwXLMHjagMg0EP5I';

    window.onload = function() {
        loadDataFromDatabase();
    };

    // FUNGSI MEMUAT DATA ONLINE DARI CLOUD
async function loadDataFromDatabase() {
    if (binId && apiKey) {
        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                method: 'GET',
                headers: {
                    'X-Master-Key': apiKey,
                    'X-Bin-Meta': 'false'
                }
            });

            if (response.ok) {
                const data = await response.json();
                // Mengambil record dari JSONBin (atau 'data' jika X-Bin-Meta: false)
                config = data.record || data;
                
                // Simpan ke memori lokal
                localStorage.setItem('pink_ratecard_config', JSON.stringify(config));
                
                // PENTING: Panggil fungsi render agar tampilan UI langsung berubah!
                if (typeof renderUI === 'function') {
                    renderUI();
                } else if (typeof applyDataToUI === 'function') {
                    applyDataToUI(config);
                }
                return;
            }
        } catch (err) {
            console.error("Gagal memuat data dari cloud:", err);
        }
    }
}
                console.log("Menggunakan data lokal...");
            }
        }
        
        // Fallback jika database belum disetting
        const savedData = localStorage.getItem('pink_ratecard_config');
        if (savedData) {
            config = JSON.parse(savedData);
        }
        applySettingsToView();
    }

    function applySettingsToView() {
        if (config.bgUrl) {
            document.body.style.background = `url('${config.bgUrl}') center/cover fixed no-repeat`;
        } else {
            document.body.style.background = `linear-gradient(135deg, ${config.themeColor}33 0%, ${config.themeColor}99 100%), linear-gradient(135deg, #fbcfe8 0%, #f472b6 100%)`;
        }

        document.body.style.fontFamily = config.fontFamily;
        document.getElementById('displayProfile').src = config.profileUrl;

        // Apply Harga
        document.getElementById('priceFb').innerText = 'Rp. ' + config.prices.fb;
        document.getElementById('priceTiktok').innerText = 'Rp. ' + config.prices.tiktok;
        document.getElementById('priceIg').innerText = 'Rp. ' + config.prices.ig;
        document.getElementById('priceReelsFb').innerText = 'Rp. ' + config.prices.reelsFb;
        document.getElementById('priceStory').innerText = 'Rp. ' + config.prices.story;
        document.getElementById('priceAll').innerText = 'Rp. ' + config.prices.all;

        // Apply Sosmed
        document.getElementById('textFb').innerText = config.socials.fb;
        document.getElementById('linkFb').href = 'https://facebook.com/' + config.socials.fb;

        document.getElementById('textTiktok').innerText = config.socials.tiktok;
        document.getElementById('linkTiktok').href = 'https://tiktok.com/@' + config.socials.tiktok;

        document.getElementById('textIg').innerText = config.socials.ig;
        document.getElementById('linkIg').href = 'https://instagram.com/' + config.socials.ig;

        // Apply Notepad
        document.getElementById('displayNotepad').innerText = config.notepad;
    }

    function toggleAdminLogin() {
        if (isAdminLoggedIn) {
            isAdminLoggedIn = false;
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('roleBadge').innerText = 'Mode: Pelihat';
            document.getElementById('authBtn').innerText = 'Login Admin';
        } else {
            const user = prompt("Masukkan Username Admin:");
            const pass = prompt("Masukkan Password Admin:");

            if (user === "rekaanjani123" && pass === "12345reka") {
                isAdminLoggedIn = true;
                document.getElementById('roleBadge').innerText = 'Mode: Admin (Versi 1)';
                document.getElementById('authBtn').innerText = 'Logout';
                document.getElementById('adminPanel').style.display = 'block';
                loadFormValues();
            } else {
                alert("Username atau Password salah!");
            }
        }
    }

    function loadFormValues() {
        document.getElementById('binApiKey').value = apiKey;
        document.getElementById('binId').value = binId;
        document.getElementById('inputBg').value = config.bgUrl;
        document.getElementById('inputColor').value = config.themeColor;
        document.getElementById('inputProfile').value = config.profileUrl;
        document.getElementById('inputFont').value = config.fontFamily;

        document.getElementById('inFb').value = config.prices.fb;
        document.getElementById('inTiktok').value = config.prices.tiktok;
        document.getElementById('inIg').value = config.prices.ig;
        document.getElementById('inReelsFb').value = config.prices.reelsFb;
        document.getElementById('inStory').value = config.prices.story;
        document.getElementById('inAll').value = config.prices.all;

        document.getElementById('inUserFb').value = config.socials.fb;
        document.getElementById('inUserTiktok').value = config.socials.tiktok;
        document.getElementById('inUserIg').value = config.socials.ig;

        document.getElementById('inNotepad').value = config.notepad;
    }

    function uploadProfileImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('inputProfile').value = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    // FUNGSI SIMPAN KE CLOUD DATABASE ONLINES
    async function saveAdminSettings() {
        const statusText = document.getElementById('loadingStatus');
        statusText.style.display = 'block';

        apiKey = document.getElementById('binApiKey').value.trim();
        binId = document.getElementById('binId').value.trim();

        localStorage.setItem('jsonbin_key', apiKey);
        localStorage.setItem('jsonbin_id', binId);

        config.bgUrl = document.getElementById('inputBg').value;
        config.themeColor = document.getElementById('inputColor').value;
        config.profileUrl = document.getElementById('inputProfile').value;
        config.fontFamily = document.getElementById('inputFont').value;

        config.prices.fb = document.getElementById('inFb').value;
        config.prices.tiktok = document.getElementById('inTiktok').value;
        config.prices.ig = document.getElementById('inIg').value;
        config.prices.reelsFb = document.getElementById('inReelsFb').value;
        config.prices.story = document.getElementById('inStory').value;
        config.prices.all = document.getElementById('inAll').value;

        config.socials.fb = document.getElementById('inUserFb').value;
        config.socials.tiktok = document.getElementById('inUserTiktok').value;
        config.socials.ig = document.getElementById('inUserIg').value;

        config.notepad = document.getElementById('inNotepad').value;

        localStorage.setItem('pink_ratecard_config', JSON.stringify(config));

        // Update ke Cloud Server via JSONBin jika Key diisi
        if (binId && apiKey) {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': apiKey
                    },
                    body: JSON.stringify(config)
                });

                if (response.ok) {
                    alert('Data BERHASIL Disimpan Online ke Database Server!');
                } else {
                    alert('Gagal menyimpan ke server online. Pastikan API Key dan Bin ID benar.');
                }
            } catch (err) {
                alert('Gagal terhubung ke Database online.');
            }
        } else {
            alert('Pengaturan disimpan lokal di perangkat ini. Untuk menyimpan secara publik ke semua pelihat, isi API Key & Bin ID JSONBin.');
        }

        statusText.style.display = 'none';
        applySettingsToView();
    }
</script>

</body>
</html>
